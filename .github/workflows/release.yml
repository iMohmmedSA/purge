# Push a tag such as `v0.1.0` (matching the version in Cargo.toml) to build
# binaries for every platform, plus .deb and .rpm packages for Linux, and
# attach them to a draft GitHub release. Review the draft, then publish it:
# publishing triggers publish.yml, which uploads the crates to crates.io.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "purge") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  build:
    needs: draft
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --package purge --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="purge-$GITHUB_REF_NAME-$TARGET"
          mkdir "$name"
          exe=""
          [[ "$TARGET" == *windows* ]] && exe=".exe"
          for bin in purge purge-rs purged; do
            cp "target/$TARGET/release/$bin$exe" "$name/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256"
      - name: Linux packages (.deb, .rpm)
        if: contains(matrix.target, 'linux')
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
          for package in $(scripts/package-linux.sh "$TARGET"); do
            sha256sum "$package" > "$package.sha256"
            gh release upload "$GITHUB_REF_NAME" "$package" "$package.sha256"
          done
