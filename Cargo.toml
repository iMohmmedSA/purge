[workspace]
resolver = "3"
members = ["apps/*", "core/*", "ecosystems/*", "platform/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/iMohmmedSA/purge"

[workspace.dependencies]
# Internal crates
purge-config = { path = "core/config", version = "0.1.0" }
purge-engine = { path = "core/engine", version = "0.1.0" }
purge-scan = { path = "core/scan", version = "0.1.0" }
purge-session = { path = "core/session", version = "0.1.0" }
purge-state = { path = "core/state", version = "0.1.0" }
purge-ecosystem = { path = "ecosystems/api", version = "0.1.0" }
purge-ecosystems = { path = "ecosystems/all", version = "0.1.0" }
purge-rust = { path = "ecosystems/rust", version = "0.1.0" }
purge-notify = { path = "platform/notify", version = "0.1.0" }
purge-process = { path = "platform/process", version = "0.1.0" }
purge-service = { path = "platform/service", version = "0.1.0" }
purge-daemon = { path = "apps/daemon", version = "0.1.0" }

# External crates (latest releases)
anyhow = "1.0.104"
bytesize = { version = "2.7.0", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
dunce = "1.0.5"
globset = "0.4.21"
humantime-serde = "1.1.1"
jiff = "0.2.43"
notify-rust = "4.19.0"
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
assert_is_empty = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = true
