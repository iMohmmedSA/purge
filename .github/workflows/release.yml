# Push a tag such as `v0.1.0` (matching the version in Cargo.toml) to build
# binaries for every platform, plus .deb and .rpm packages for Linux, and
# attach them to a draft GitHub release with the install scripts. Each
# installer is then tried on a real Linux, macOS and Windows machine against
# the draft's files. Review the draft, then publish it: publishing triggers
# publish.yml, which uploads the crates to crates.io.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "purge") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" install.sh install.ps1

  build:
    needs: draft
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --package purge --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="purge-$GITHUB_REF_NAME-$TARGET"
          mkdir "$name"
          exe=""
          [[ "$TARGET" == *windows* ]] && exe=".exe"
          for bin in purge purge-rs purged; do
            cp "target/$TARGET/release/$bin$exe" "$name/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256"
      - name: Linux packages (.deb, .rpm)
        if: contains(matrix.target, 'linux')
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
          for package in $(scripts/package-linux.sh "$TARGET"); do
            sha256sum "$package" > "$package.sha256"
            gh release upload "$GITHUB_REF_NAME" "$package" "$package.sha256"
          done

  # Runs each installer the way users will, against this draft's files
  # (served locally, since a draft is not public yet), on every system.
  installers:
    needs: build
    name: install on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      PURGE_VERSION: ${{ github.ref_name }}
      PURGE_DOWNLOAD_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v7
      - name: Serve the draft's files
        shell: bash
        run: |
          mkdir -p "site/download/$GITHUB_REF_NAME"
          gh release download "$GITHUB_REF_NAME" --dir "site/download/$GITHUB_REF_NAME"
          python=$(command -v python3 || command -v python)
          "$python" -m http.server 8765 --bind 127.0.0.1 --directory site > /dev/null 2>&1 &
          sleep 2
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          ~/.local/bin/purge --version
          ~/.local/bin/purge-rs --version
          test -x ~/.local/bin/purged
          # Running it again is how users update.
          sh install.sh | tee again.txt
          grep -q "already installed and up to date" again.txt
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\purge'
          & (Join-Path $dir 'purge.exe') --version
          & (Join-Path $dir 'purge-rs.exe') --version
          if (-not (Test-Path (Join-Path $dir 'purged.exe'))) { throw 'purged.exe missing' }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $dir) { throw 'not added to PATH' }
          # Running it again is how users update.
          $again = ./install.ps1 6>&1 | Out-String
          Write-Host $again
          if ($again -notmatch 'already installed and up to date') { throw 'second run did not see the installed version' }
